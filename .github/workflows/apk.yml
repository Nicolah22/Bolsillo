name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar la app (www)
        run: python3 scripts/build_www.py

      - name: Copiar la app al proyecto Android
        run: npx cap sync android

      - name: Compilar APK firmada
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          # 1) Con lector de notificaciones de bancos
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          cp app/build/outputs/apk/release/app-release.apk ../Bolsillo-con-lector.apk
          # 2) Normal: sin el servicio que Play Protect bloquea fuera de la Play Store
          python3 - <<'PY'
          import re
          p="app/src/main/AndroidManifest.xml";s=open(p).read()
          s=re.sub(r"\s*<!-- Lee las notificaciones.*?</service>","",s,flags=re.S)
          open(p,"w").write(s)
          PY
          ! grep -q NotiBancoService app/src/main/AndroidManifest.xml
          ./gradlew assembleRelease --no-daemon 2>&1 | tee -a ../gradle.log
          cp app/build/outputs/apk/release/app-release.apk ../Bolsillo.apk

      - name: Mostrar el error de compilación
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          t=open("gradle.log",encoding="utf-8",errors="replace").read()
          i=t.find("What went wrong")
          parte=t[i:i+3000] if i>=0 else t[-3000:]
          for linea in [l for l in parte.splitlines() if l.strip()][:40]:
              print("::error::"+linea.replace("%","%25"))
          PY

      - name: Guardar APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: Bolsillo-apk
          path: |
            Bolsillo.apk
            Bolsillo-con-lector.apk

      - name: Publicar versión
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bolsillo 1.0.${{ github.run_number }}
          body: |
            **Bolsillo.apk**: la versión normal. Se instala sin problema; si ya tenías Bolsillo, se actualiza sin perder los datos.
            **Bolsillo-con-lector.apk**: igual, pero además lee las notificaciones de los bancos. Google Play Protect la bloquea si se instala desde el navegador o WhatsApp; ver README.
          files: |
            Bolsillo.apk
            Bolsillo-con-lector.apk
          make_latest: true
